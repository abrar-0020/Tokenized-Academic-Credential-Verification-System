<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky bg-surface-container shadow-sm z-50">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full max-w-max-width mx-auto">
<div class="flex items-center gap-sm active:scale-95 duration-150 cursor-pointer hover:bg-surface-variant/50 transition-colors p-2 rounded-lg -ml-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-semibold">CredentialVault</span>
</div>
<!-- Trailing Avatar (Public flow, might represent the viewing entity or just be a placeholder) -->
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/30 active:scale-95 duration-150 cursor-pointer">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a person in business casual attire against a clean, light-mode background. The lighting is soft and corporate, fitting an academic tech precision aesthetic with a deep emerald and warm ivory color palette in the surrounding context. The mood is trustworthy and authoritative." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9iQ6BKqfIhGgs8tZMXlrwGEMsuU65xDMd3trq8XhYQGA98aIghY_n_vS0rRSyIitAFytuwmagZ51OxxK62AFwiQzihKnQ4XhPrz_ReXZpQFk0VO8ZsTRzJMyhYu0xWB3uR_pEKTJJjjXR0g7OQDlwzmpOBxpJPWHB-PaDWhLzqNgS7RltTlV04-jLCDGBJhP3NSDaDSmvUUjyB_wRKnzwem4jXopTIyjtL5AbJKQmDJ0j0EsL2o0g"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Document / Bento Container -->
<div class="max-w-lg w-full bg-surface rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.03)] border border-outline-variant/20 relative overflow-hidden flex flex-col">
<!-- Academic Tech Precision Accent Bar -->
<div class="absolute top-0 left-0 w-full h-1 bg-tertiary-container"></div>
<div class="p-lg md:p-xl flex flex-col items-center text-center">
<!-- Status Icon Container -->
<div class="w-24 h-24 rounded-full bg-error-container/30 flex items-center justify-center mb-md relative">
<div class="w-16 h-16 rounded-full bg-error-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-error-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">gavel</span>
</div>
<!-- Secondary badge indicating failure -->
<div class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-error flex items-center justify-center border-2 border-surface shadow-sm">
<span class="material-symbols-outlined text-on-error" style="font-size: 16px; font-variation-settings: 'wght' 600;">close</span>
</div>
</div>
<!-- Status Chip -->
<div class="bg-error-container text-on-error-container font-label-md text-label-md px-3 py-1 rounded-full mb-md flex items-center gap-1 uppercase tracking-widest">
<span class="material-symbols-outlined" style="font-size: 14px;">warning</span>
                    Revoked
                </div>
<!-- Headline -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Credential Not Valid</h1>
<!-- Explanation -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-sm">
                    This credential has been marked as revoked by the issuing institution. It is no longer considered a valid proof of claim within the registry.
                </p>
<!-- Divider -->
<div class="w-full h-[1px] bg-outline-variant/30 mb-lg"></div>
<!-- Actions -->
<div class="flex flex-col w-full gap-sm">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-size: 20px;">qr_code_scanner</span>
                        Try Another Credential
                    </button>
<button class="w-full bg-transparent border border-outline-variant text-primary font-label-lg text-label-lg py-3 rounded-xl hover:bg-surface-variant/30 transition-colors">
                        View Details
                    </button>
</div>
</div>
<!-- Subtle Watermark / Footer of card -->
<div class="bg-surface-container-low px-lg py-sm text-center border-t border-outline-variant/20">
<p class="font-label-md text-label-md text-outline">Verified by CredentialVault Protocol · Secure Ledger</p>
