<style>

            position: absolute;
            width: 8px;
            height: 16px;
            background: #064E3B;
            top: -20px;
            opacity: 0;
        }
        @keyframes fall {
            0% { top: -20px; opacity: 1; transform: translateX(0) rotate(0deg); }
            100% { top: 100vh; opacity: 0; transform: translateX(100px) rotate(360deg); }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">

<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed font-semibold md:font-headline-lg md:text-headline-lg">CredentialVault</span>

<div class="flex items-center">
<img alt="user_profile_avatar" class="w-8 h-8 rounded-full object-cover border border-outline-variant/30" data-alt="A small, professional portrait headshot of a student or academic professional, serving as a user profile avatar. The background is a muted, neutral grey to emphasize the subject. Lighting is soft and even, typical of a high-quality corporate headshot. The overall style aligns with a clean, modern, and trustworthy academic platform interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuADfI3P33jyba4aEo9RscwmW3D8GrkXUVNVnCU-KE_jmhqK1yXr3jr9jJXjyk_wNb0fsi56n6OA5GnHO49olGphrn8d0-5yf7X3rOR7YVGpg_XxrZgnZr7j6RE23TdYVAy1qgJvcJYyWaXppOmsrofp32VboDRogNPVlI0lSQC5ZrRbrt72agxxVdwxmoL_NYzHvk4s0hODogxg6xMyThR4qhaQ394ehI0HlhfREWEKpTx8-UiDclyH"/>

</div>

<!-- Main Content -->

<!-- Confetti Container (JS populated) -->

<div class="max-w-2xl w-full bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] p-lg md:p-xl flex flex-col items-center text-center relative z-10 animate-[fadeIn_0.5s_ease-out]">

<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[40px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary mb-sm">✓ Credential Issued</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-lg">Your academic credential has been successfully recorded.</p>
<!-- Details Card -->
<div class="w-full bg-surface-container-low rounded-lg p-md mb-lg border-l-4 border-tertiary text-left">
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<span class="font-label-md text-label-md text-outline block mb-xs">Credential ID</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">ACAD-2024-98765-XT</span>
</div>
<div>
<span class="font-label-md text-label-md text-outline block mb-xs">Transaction ID</span>
<span class="font-body-md text-body-md text-on-surface font-mono">0x7f8a9b...2c3d4e</span>
</div>
</div>

<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
                    View Credential

                </button>

<script>
        // Simple confetti effect for success state
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#064E3B', '#D1FAE5', '#733100', '#c3ecd7'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Random properties
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.animationDelay = Math.random() * 1 + 's';
                
                container.appendChild(confetti);
            }
        });
    </script>
