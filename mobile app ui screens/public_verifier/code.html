<body class="bg-surface text-on-surface min-h-screen flex flex-col">

<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="max-w-md w-full bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.02)] border border-outline-variant/20 p-xl relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full -z-10"></div>
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-high mb-md text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">Verify a Credential</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter the credential details or scan to authenticate.</p>
</div>
<form class="space-y-md">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="description">description</span>
</div>
<input class="block w-full pl-12 pr-md py-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder-on-surface-variant/60" id="credential-id" placeholder="Enter credential or token ID" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<button class="w-full flex items-center justify-center gap-sm py-4 px-md bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg hover:bg-primary-container/90 transition-colors shadow-sm active:scale-[0.98]" type="button">
                        Verify Credential
                    </button>
<button class="w-full flex items-center justify-center gap-sm py-4 px-md bg-transparent border border-outline text-on-surface rounded-xl font-label-lg text-label-lg hover:bg-surface-variant/30 transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
                        Scan QR Code
                    </button>
</div>
<div class="text-center mt-md">
<p class="font-label-md text-label-md text-outline flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>

                    </p>
</div>
