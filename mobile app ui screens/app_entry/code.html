<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CredentialVault</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#476c5b",
                        "surface": "#f9f9f8",
                        "on-tertiary-fixed": "#331200",
                        "tertiary-fixed-dim": "#ffb68e",

                        "surface-variant": "#e2e2e2",
                        "outline": "#707974",
                        "surface-tint": "#2b6954",
                        "secondary-fixed": "#c3ecd7",
                        "inverse-primary": "#95d3ba",
                        "tertiary": "#502000",
                        "inverse-on-surface": "#f1f1f0",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9f8",
                        "primary-container": "#064e3b",
                        "on-tertiary-fixed-variant": "#763300",
                        "on-primary-fixed-variant": "#0b513d",
                        "on-primary-fixed": "#002117",
                        "on-surface-variant": "#404944",
                        "on-surface": "#1a1c1c",
                        "primary-fixed": "#b0f0d6",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#95d3ba",
                        "on-primary-container": "#80bea6",
                        "surface-container-low": "#f3f4f3",
                        "inverse-surface": "#2f3130",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdbca",
                        "on-tertiary-container": "#ff985a",
                        "outline-variant": "#bfc9c3",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#002115",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#294e3f",
                        "secondary": "#416656",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "tertiary-container": "#733100",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e8e8e7",
                        "primary": "#003527",
                        "secondary-fixed-dim": "#a8cfbc",
                        "surface-container": "#eeeeed",
                        "background": "#f9f9f8",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "gutter": "24px",
                        "xl": "40px",
                        "xs": "4px",
                        "md": "16px",
                        "max-width": "1280px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden per rules, but showing brand if requested, opting for minimal branding here instead of full app bar) -->
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-tertiary-container/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<div class="w-full max-w-[600px] flex flex-col items-center text-center">
<!-- Brand Icon / Logo Substitute -->
<div class="mb-gutter text-primary bg-primary-container/10 p-md rounded-full">
<span class="material-symbols-outlined text-[48px]">account_balance</span>
</div>
<!-- Headline -->
<h1 class="font-display-lg text-display-lg text-on-surface mb-md">
                Verify academic credentials with confidence.
            </h1>
<!-- Supporting Text -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-md">
                Instantly verify blockchain-backed academic credentials in a secure, authoritative environment.
            </p>
<!-- Pathways -->
<div class="w-full flex flex-col gap-md mb-xl">
<!-- Primary Button -->
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-md rounded-[12px] hover:bg-primary-container/90 transition-colors shadow-sm flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">verified</span>
                    Verify a Credential
                </button>
<!-- Secondary Button -->
<button class="w-full bg-surface-container-low text-primary font-label-lg text-label-lg py-md rounded-[12px] border border-outline-variant hover:bg-surface-variant/50 transition-colors shadow-sm flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">folder_shared</span>
                    View My Credentials
                </button>
</div>
<!-- Subtle Text Link -->
<a class="font-label-md text-label-md text-primary hover:underline underline-offset-4 mb-xl transition-all" href="#">
                Authorized Issuer login
            </a>
<!-- Trust Indicators (Bento-style row) -->
<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-sm mt-md border-t border-outline-variant/30 pt-lg">
<div class="flex items-center justify-center md:justify-start gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">link</span>
<span class="font-label-md text-label-md">Blockchain verified</span>
</div>
<div class="flex items-center justify-center md:justify-start gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">shield</span>
<span class="font-label-md text-label-md">Tamper-resistant</span>
</div>
<div class="flex items-center justify-center md:justify-start gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">bolt</span>
<span class="font-label-md text-label-md">Instant verification</span>
</div>
</div>
</div>
</main>
</body></html>
