<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TokCred | Blockchain Credential Verification</title>
    <meta name="description" content="TokCred - Secure blockchain-based academic credential verification system" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#3b82f6" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TokCred" />
    <style>
.loader-container {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background-color: #000000;
  z-index: 9999;
}

.loader {
  --duration: 3200ms;
  width: 200px;
  height: 200px;
  position: relative;
}

.loader::before,
.loader::after {
  content: '';
  position: absolute;
  background: #ffffff;
}

.box {
  position: absolute;
  animation: var(--duration) linear forwards infinite;
  transform: translate(var(--x), var(--y));
  will-change: transform;
  backface-visibility: hidden;
}

.box > div {
  width: 64px;
  height: 64px;
  position: relative;
  transform-style: preserve-3d;
  animation: var(--duration) ease forwards infinite;
  transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0);
  background: #2563eb;
  will-change: transform;
  backface-visibility: hidden;
}

.box > div::before,
.box > div::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
  backface-visibility: hidden;
}

.box > div::before {
  top: 100%;
  left: 0;
  transform: rotateX(-90deg);
  background: #2563eb;
  filter: brightness(1.15);
}

.box > div::after {
  top: 0;
  left: 100%;
  transform: rotateY(90deg);
  background: #2563eb;
  filter: brightness(1.4);
}

.box0 { --x: -293px; --y: -160px; left: 77px; top: 144px; animation-name: box-move0; }
.box0 > div { animation-name: box-scale0; }

.box1 { --x: -347px; --y: 160px; left: 33px; top: 160px; animation-name: box-move1; }
.box1 > div { animation-name: box-scale1; }

.box2 { --x: 160px; --y: -253px; left: 77px; top: 85px; animation-name: box-move2; }
.box2 > div { animation-name: box-scale2; }

.box3 { --x: 373px; --y: -53px; left: 121px; top: 160px; animation-name: box-move3; }
.box3 > div { animation-name: box-scale3; }

.box4 { --x: 80px; --y: 267px; left: 77px; top: 176px; animation-name: box-move4; }
.box4 > div { animation-name: box-scale4; }

.box5 { --x: -293px; --y: -160px; left: 33px; top: 101px; animation-name: box-move5; }
.box5 > div { animation-name: box-scale5; }

.box6 { --x: -347px; --y: 160px; left: 121px; top: 101px; animation-name: box-move6; }
.box6 > div { animation-name: box-scale6; }

.box7 { --x: -320px; --y: 267px; left: 77px; top: 116px; animation-name: box-move7; }
.box7 > div { animation-name: box-scale7; }

.ground {
  position: absolute;
  width: 200px;
  height: 200px;
  left: 27px;
  top: 80px;
  transform-style: preserve-3d;
  transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg);
  will-change: transform;
}

.ground > div {
  width: 100%;
  height: 100%;
  background: #ffffff;
  opacity: 0;
  animation: ground-shine var(--duration) linear infinite forwards;
}

@keyframes box-move0 { 12% { transform: translate(var(--x), var(--y)); } 25%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale0 { 6% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 14%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move1 { 16% { transform: translate(var(--x), var(--y)); } 29%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale1 { 10% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 18%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move2 { 20% { transform: translate(var(--x), var(--y)); } 33%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale2 { 14% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 22%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move3 { 24% { transform: translate(var(--x), var(--y)); } 37%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale3 { 18% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 26%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move4 { 28% { transform: translate(var(--x), var(--y)); } 41%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale4 { 22% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 30%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move5 { 32% { transform: translate(var(--x), var(--y)); } 45%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale5 { 26% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 34%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move6 { 36% { transform: translate(var(--x), var(--y)); } 49%, 52% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale6 { 30% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 38%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
@keyframes box-move7 { 40% { transform: translate(var(--x), var(--y)); } 49%, 53% { transform: translate(0, 0); } 80% { transform: translate(0, -43px); } 90%, 100% { transform: translate(0, 251px); } }
@keyframes box-scale7 { 34% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 42%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }

@keyframes ground-shine { 0%, 70% { opacity: 0; } 75%, 87% { opacity: 0.15; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-container">
        <div class="loader">
          <div class="box box0"><div></div></div>
          <div class="box box1"><div></div></div>
          <div class="box box2"><div></div></div>
          <div class="box box3"><div></div></div>
          <div class="box box4"><div></div></div>
          <div class="box box5"><div></div></div>
          <div class="box box6"><div></div></div>
          <div class="box box7"><div></div></div>
          <div class="ground"><div></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
